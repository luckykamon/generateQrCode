<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body style="text-align: center">
<p>Documentation of API can be found here: <a href=\"https://documenter.getpostman.com/view/12914728/2s93ecwAaw\" target=\"blank\">https://documenter.getpostman.com/view/12914728/2s93ecwAaw</a></p>
<input type="text" id="inputField">
<button onclick="sendRequest()">Envoyer</button>
<img id="qrCodeImage" src="" style="max-height: 100vh; max-width: 100%; margin: auto">

<script>
    function sendRequest() {
        var inputHtml = document.getElementById("inputField").value;

        var myHeaders = new Headers();
        myHeaders.append("Content-Type", "application/json");

        var raw = JSON.stringify({
            "text": inputHtml
        });

        var requestOptions = {
            method: 'POST',
            headers: myHeaders,
            body: raw,
            redirect: 'follow'
        };

        fetch("http://localhost:4020/qrcode", requestOptions)
            .then(response => response.text())
            .then(result => {
                var qrCodeImage = document.getElementById("qrCodeImage");
                qrCodeImage.src = "http://localhost:4020/getQrCode/" + result;
                qrCodeImage.style.display = "block";
            })
            .catch(error => console.log('error', error));
    }
</script>
</body>

</html>
